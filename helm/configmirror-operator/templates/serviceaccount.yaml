{{- if .Values.serviceAccount.create }}
# =============================================================================
# ServiceAccount for the ConfigMirror operator pod.
#
# SECURITY (IRSA):
#   The annotation eks.amazonaws.com/role-arn tells the EKS Pod Identity
#   Webhook to inject a projected service account token into the pod.
#   The AWS SDK inside the operator automatically picks up this token and
#   exchanges it for temporary STS credentials scoped to the IRSA role.
#
#   Result: the operator pod gets AWS access (SSM, RDS) with ZERO stored keys.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "configmirror-operator.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "configmirror-operator.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
