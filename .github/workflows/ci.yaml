# =============================================================================
# CI Workflow — runs on every pull request and push to main.
#
# Jobs:
#   1. lint     — Go vet + staticcheck + golangci-lint
#   2. test     — Unit tests with race detector
#   3. security — gosec static security analysis
#   4. helm     — Helm chart lint and template render validation
#
# SECURITY:
#   - Runs with minimal permissions (read-only by default)
#   - No AWS credentials needed for CI — only build + test
#   - Dependency cache is scoped to the repo to prevent cache poisoning
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# SECURITY: Minimal permissions — read-only unless explicitly granted
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint the Go code
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: operator
          args: --timeout=5m

  # ---------------------------------------------------------------------------
  # Job 2: Run unit tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache: true

      - name: Run tests
        run: |
          go test ./... \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=120s

      - name: Check test coverage (must be >= 60%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 30" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the required 60%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the required threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: operator/coverage.out

  # ---------------------------------------------------------------------------
  # Job 3: Security scanning with gosec
  # gosec scans Go code for common security issues:
  #   G101 - hardcoded credentials
  #   G401 - use of weak crypto
  #   G501 - use of MD5/SHA1
  #   etc.
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: "-fmt sarif -out results.sarif ./operator/..."

      - name: Upload gosec SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif

  # ---------------------------------------------------------------------------
  # Job 4: Validate the Helm chart
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Helm lint
        run: helm lint ./helm/configmirror-operator

      - name: Helm template render (validate no syntax errors)
        run: |
          helm template configmirror ./helm/configmirror-operator \
            --set image.repository=test.dkr.ecr.us-east-1.amazonaws.com/test \
            --set image.tag=test \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::123456789012:role/test \
            > /dev/null
          echo "✅ Helm template rendered successfully"

  # ---------------------------------------------------------------------------
  # Job 5: Validate Terraform formatting
  # ---------------------------------------------------------------------------
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform/
